<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM — Sales & IT Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#151a23; --muted:#6b7280; --line:#e5e7eb;
  --side:#11151c; --side-ink:#c9ced8; --side-hi:#fff;
  --sales:#4f46e5; --sales-soft:#eef0ff; --it:#ea580c; --it-soft:#fff3eb;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;display:flex}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* sidebar */
aside{width:220px;flex-shrink:0;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px}
.brand{font-weight:700;color:#fff;font-size:17px;padding:4px 10px 20px;letter-spacing:-.2px}
.brand span{color:#8b8ff8}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;margin-bottom:2px;font-weight:500}
nav a:hover{background:#1c222c;color:#fff}
nav a.active{background:#232a36;color:#fff}
nav .dot{width:8px;height:8px;border-radius:50%;background:#5b6472}
nav a[data-v=sales] .dot{background:var(--sales)} nav a[data-v=support] .dot{background:var(--it)}
nav .count{margin-left:auto;font-size:12px;background:#2b3341;padding:1px 7px;border-radius:10px}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5b6472;padding:16px 10px 6px}
.status{margin-top:auto;font-size:12px;color:#7d8696;padding:10px}
/* main */
main{flex:1;overflow:auto;padding:24px 28px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0;letter-spacing:-.3px}
.head .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:#f3f4f6}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sales{background:var(--sales);border-color:var(--sales);color:#fff}
.btn.it{background:var(--it);border-color:var(--it);color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.search{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;min-width:220px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .k{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.stat.s{border-top:3px solid var(--sales)} .stat.i{border-top:3px solid var(--it)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel h3{margin:0;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr} aside{width:64px} .brand,.navlabel,nav .txt,.status,nav .count{display:none}}
/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafafa;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#fafbff}
.id{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* pills */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:#f1f2f4;color:#374151}
.p-Urgent{background:#fee2e2;color:#b91c1c}.p-High{background:#ffedd5;color:#c2410c}.p-Normal{background:#e0f2fe;color:#0369a1}.p-Low{background:#f1f5f9;color:#475569}
.st-Open{background:#fff3eb;color:#c2410c}.st-In-progress{background:#e0e7ff;color:#3730a3}.st-Waiting-on-customer{background:#fef9c3;color:#854d0e}.st-Resolved{background:#dcfce7;color:#166534}.st-Closed{background:#f1f5f9;color:#475569}
.sg-Won{background:#dcfce7;color:#166534}.sg-Lost{background:#fee2e2;color:#991b1b}
.overdue{color:var(--bad);font-weight:600}
/* kanban */
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#eceef2;border-radius:var(--radius);padding:10px;min-height:300px;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--sales);background:var(--sales-soft)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px;font-weight:600;font-size:13px}
.col-h small{color:var(--muted);font-weight:500}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card:hover{border-color:#c7cbf7}
.card .t{font-weight:600;margin:3px 0 6px}
.card .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.card .val{color:var(--ink);font-weight:600}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(17,21,28,.4);display:none;z-index:10}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:11;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.1)}
.drawer.on{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:6px 0 0;font-size:18px}
.drawer .body{flex:1;overflow:auto;padding:18px 20px}
.drawer .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 12px;margin-bottom:18px;align-items:center}
.kv .k{color:var(--muted);font-size:13px}
.kv select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
.desc{background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;margin-bottom:18px}
.notes h4{margin:0 0 10px;font-size:13px}
.note{border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-left:4px}
.note .w{font-size:11px;color:var(--muted)}
.addnote{display:flex;gap:8px;margin-top:8px}
.addnote textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px;resize:vertical}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;z-index:21;padding:22px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.on{display:block}
#mscrim{z-index:20}
.modal h2{margin:0 0 16px;font-size:18px}
.f{margin-bottom:12px} .f label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.f textarea{min-height:90px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tag.s{color:var(--sales)} .tag.i{color:var(--it)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:30;display:none}
.toast.on{display:block}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<aside>
  <div class="brand">Core<span>CRM</span></div>
  <nav>
    <a href="#dashboard" data-v="dashboard"><span class="dot"></span><span class="txt">Dashboard</span></a>
    <div class="navlabel">Pipelines</div>
    <a href="#sales" data-v="sales"><span class="dot"></span><span class="txt">Sales</span><span class="count" id="c-sales">0</span></a>
    <a href="#support" data-v="support"><span class="dot"></span><span class="txt">IT Support</span><span class="count" id="c-support">0</span></a>
    <div class="navlabel">Directory</div>
    <a href="#contacts" data-v="contacts"><span class="dot"></span><span class="txt">Contacts</span><span class="count" id="c-contacts">0</span></a>
  </nav>
  <div class="status" id="status">Connecting…</div>
</aside>
<main id="main"></main>

<div class="scrim" id="dscrim"></div>
<div class="drawer" id="drawer"></div>
<div class="scrim" id="mscrim"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- config ---------- */
const STAGES=["New lead","Qualified","Proposal","Negotiation","Won","Lost"];
const T_STATUS=["Open","In progress","Waiting on customer","Resolved","Closed"];
const PRIORITY=["Urgent","High","Normal","Low"];
const SLA_HRS={Urgent:4,High:8,Normal:24,Low:72};
const CATEGORIES=["Hardware","Software","Network","Email","Accounts & access","Printer","Other"];
const SOURCES=["Website","Referral","Phone","Email","Social","Event","Other"];

/* ---------- state ---------- */
const S={contacts:[],deals:[],tickets:[]};
let db=null, view="dashboard", openRec=null;
const F={sales:{q:"",owner:""},support:{q:"",status:"active",priority:"",assignee:""},contacts:{q:""}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>"£"+(Number(n)||0).toLocaleString("en-GB",{maximumFractionDigits:0});
const cls=s=>String(s).replace(/\s+/g,"-");
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<24)return h+"h ago";return Math.round(h/24)+"d ago"};
const until=t=>{const m=Math.max(0,Math.round((t-Date.now())/60000));if(m<60)return m+"m";const h=Math.round(m/60);if(h<48)return h+"h";return Math.round(h/24)+"d"};
const fmtDate=t=>t?new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—";
const contact=id=>S.contacts.find(c=>c.id===id);
const cname=id=>contact(id)?.name||"—";
const nextNum=(list,start)=>Math.max(start-1,...list.map(x=>x.num||0))+1;
const dueAt=t=>t.createdAt+(SLA_HRS[t.priority]||24)*3600e3;
const isActive=t=>!["Resolved","Closed"].includes(t.status);
const isOverdue=t=>isActive(t)&&Date.now()>dueAt(t);
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}

/* ---------- storage ---------- */
async function save(coll,rec){
  const {id,...body}=rec;
  if(db){
    try{await db.collection(coll).doc(id).set(JSON.parse(JSON.stringify(body)))}
    catch(e){toast(e.code==="invalid_argument"?"You don't have permission to edit":"Couldn't save — try again");console.error(e)}
  }else{
    const L=S[coll],i=L.findIndex(x=>x.id===id); i>=0?L[i]=rec:L.push(rec); local(); render();
  }
}
async function del(coll,id){
  if(db){try{await db.collection(coll).doc(id).delete()}catch(e){toast("Couldn't delete");console.error(e)}}
  else{S[coll]=S[coll].filter(x=>x.id!==id);local();render()}
}
function local(){try{localStorage.setItem("crm-local",JSON.stringify(S))}catch{}}

async function init(){
  render();
  try{db=window.claude?.use?await window.claude.use("db"):null}catch{db=null}
  if(!db){
    try{Object.assign(S,JSON.parse(localStorage.getItem("crm-local")||"{}"))}catch{}
    $("#status").textContent="Offline preview — saved in this browser only";
    render();return;
  }
  let pending=3;
  const timer=setTimeout(()=>{$("#status").textContent="Can't reach the database yet…"},10000);
  for(const coll of ["contacts","deals","tickets"]){
    let first=true;
    db.collection(coll).onSnapshot(snap=>{
      S[coll]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(first&&!snap.metadata.fromCache){first=false;if(--pending===0){clearTimeout(timer);$("#status").textContent="● Synced"}}
      if(openRec&&openRec.coll===coll)refreshDrawer();
      render();
    },e=>{clearTimeout(timer);$("#status").textContent="Database unavailable";console.error(e)});
  }
}

/* ---------- routing ---------- */
function route(){view=(location.hash.slice(1)||"dashboard");if(!["dashboard","sales","support","contacts"].includes(view))view="dashboard";render()}
addEventListener("hashchange",route);

function render(){
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.dataset.v===view));
  $("#c-sales").textContent=S.deals.filter(d=>!["Won","Lost"].includes(d.stage)).length;
  $("#c-support").textContent=S.tickets.filter(isActive).length;
  $("#c-contacts").textContent=S.contacts.length;
  const keep=document.activeElement?.id;const pos=keep&&document.activeElement.selectionStart;
  $("#main").innerHTML=({dashboard:vDash,sales:vSales,support:vSupport,contacts:vContacts})[view]();
  bindView();
  if(keep&&document.getElementById(keep)){const el=document.getElementById(keep);el.focus();try{el.setSelectionRange(pos,pos)}catch{}}
}

/* ---------- views ---------- */
function vDash(){
  const open=S.deals.filter(d=>!["Won","Lost"].includes(d.stage));
  const won=S.deals.filter(d=>d.stage==="Won");
  const closed=S.deals.filter(d=>["Won","Lost"].includes(d.stage)).length;
  const act=S.tickets.filter(isActive), od=act.filter(isOverdue);
  const recentT=[...act].sort((a,b)=>(PRIORITY.indexOf(a.priority)-PRIORITY.indexOf(b.priority))||a.createdAt-b.createdAt).slice(0,6);
  const recentD=[...open].sort((a,b)=>(b.value||0)-(a.value||0)).slice(0,6);
  return `<div class="head"><h1>Dashboard</h1><span class="spacer"></span>
    <button class="btn sales" data-act="newDeal">+ Sales ticket</button><button class="btn it" data-act="newTicket">+ IT ticket</button></div>
  <div class="grid">
    <div class="stat s"><div class="k">Open pipeline</div><div class="v">${money(open.reduce((s,d)=>s+(+d.value||0),0))}</div></div>
    <div class="stat s"><div class="k">Won (all time)</div><div class="v">${money(won.reduce((s,d)=>s+(+d.value||0),0))}</div></div>
    <div class="stat s"><div class="k">Win rate</div><div class="v">${closed?Math.round(won.length/closed*100)+"%":"—"}</div></div>
    <div class="stat i"><div class="k">Open IT tickets</div><div class="v">${act.length}</div></div>
    <div class="stat i"><div class="k">Past SLA</div><div class="v" style="color:${od.length?"var(--bad)":"inherit"}">${od.length}</div></div>
  </div>
  <div class="two">
    <div class="panel"><h3><span class="tag s">Sales</span> &nbsp;Biggest open deals</h3>${recentD.length?`<table>${recentD.map(d=>`<tr class="click" data-open="deals:${d.id}"><td class="id">SAL-${d.num}</td><td>${esc(d.title)}<div class="hint">${esc(cname(d.contactId))}</div></td><td><span class="pill">${esc(d.stage)}</span></td><td style="text-align:right;font-weight:600">${money(d.value)}</td></tr>`).join("")}</table>`:`<div class="empty">No open deals yet</div>`}</div>
    <div class="panel"><h3><span class="tag i">IT Support</span> &nbsp;Needs attention</h3>${recentT.length?`<table>${recentT.map(t=>`<tr class="click" data-open="tickets:${t.id}"><td class="id">IT-${t.num}</td><td>${esc(t.subject)}<div class="hint ${isOverdue(t)?"overdue":""}">${isOverdue(t)?"Past SLA":"Due in "+until(dueAt(t))}</div></td><td><span class="pill p-${t.priority}">${t.priority}</span></td><td><span class="pill st-${cls(t.status)}">${t.status}</span></td></tr>`).join("")}</table>`:`<div class="empty">No open IT tickets 🎉</div>`}</div>
  </div>`;
}

function vSales(){
  const f=F.sales, q=f.q.toLowerCase();
  const owners=[...new Set(S.deals.map(d=>d.owner).filter(Boolean))];
  const list=S.deals.filter(d=>(!q||[d.title,cname(d.contactId),"sal-"+d.num].join(" ").toLowerCase().includes(q))&&(!f.owner||d.owner===f.owner));
  return `<div class="head"><div><h1>Sales pipeline</h1><div class="sub">Drag cards between stages · separate from IT support</div></div><span class="spacer"></span>
    <input class="search" id="qs" placeholder="Search deals…" value="${esc(f.q)}">
    <select class="search" style="min-width:0" id="fo"><option value="">All owners</option>${owners.map(o=>`<option ${o===f.owner?"selected":""}>${esc(o)}</option>`).join("")}</select>
    <button class="btn sales" data-act="newDeal">+ Sales ticket</button></div>
  <div class="board">${STAGES.map(st=>{const c=list.filter(d=>d.stage===st);return `<div class="col" data-stage="${st}">
    <div class="col-h">${st}<small>${c.length} · ${money(c.reduce((s,d)=>s+(+d.value||0),0))}</small></div>
    ${c.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(d=>`<div class="card" draggable="true" data-id="${d.id}" data-open="deals:${d.id}">
      <div class="id">SAL-${d.num}</div><div class="t">${esc(d.title)}</div>
      <div class="m"><span>${esc(cname(d.contactId))}</span><span class="val">${money(d.value)}</span></div>
      ${d.closeDate?`<div class="m" style="margin-top:4px"><span>Close ${fmtDate(d.closeDate)}</span><span>${esc(d.owner||"")}</span></div>`:""}
    </div>`).join("")}</div>`}).join("")}</div>`;
}

function vSupport(){
  const f=F.support,q=f.q.toLowerCase();
  const people=[...new Set(S.tickets.map(t=>t.assignee).filter(Boolean))];
  let list=S.tickets.filter(t=>(!q||[t.subject,cname(t.contactId),"it-"+t.num,t.category].join(" ").toLowerCase().includes(q))
    &&(f.status==="active"?isActive(t):f.status==="overdue"?isOverdue(t):!f.status||t.status===f.status)
    &&(!f.priority||t.priority===f.priority)&&(!f.assignee||(f.assignee==="__none"?!t.assignee:t.assignee===f.assignee)));
  list.sort((a,b)=>(isOverdue(b)-isOverdue(a))||(PRIORITY.indexOf(a.priority)-PRIORITY.indexOf(b.priority))||a.createdAt-b.createdAt);
  const sel=(id,cur,opts)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${v}" ${v===cur?"selected":""}>${l}</option>`).join("")}</select>`;
  return `<div class="head"><div><h1>IT Support queue</h1><div class="sub">SLA: Urgent 4h · High 8h · Normal 24h · Low 72h</div></div><span class="spacer"></span>
    <input class="search" id="qt" placeholder="Search tickets…" value="${esc(f.q)}">
    <button class="btn it" data-act="newTicket">+ IT ticket</button></div>
  <div class="filters">
    ${sel("fs",f.status,[["active","Active (not resolved)"],["overdue","Past SLA"],["","All statuses"],...T_STATUS.map(s=>[s,s])])}
    ${sel("fp",f.priority,[["","All priorities"],...PRIORITY.map(p=>[p,p])])}
    ${sel("fa",f.assignee,[["","Anyone"],["__none","Unassigned"],...people.map(p=>[p,esc(p)])])}
  </div>
  <div class="panel">${list.length?`<table><thead><tr><th>ID</th><th>Subject</th><th>Requester</th><th>Category</th><th>Priority</th><th>Status</th><th>Assignee</th><th>SLA</th></tr></thead><tbody>
  ${list.map(t=>`<tr class="click" data-open="tickets:${t.id}"><td class="id">IT-${t.num}</td><td><b style="font-weight:600">${esc(t.subject)}</b><div class="hint">Opened ${ago(t.createdAt)}</div></td>
    <td>${esc(cname(t.contactId))}</td><td>${esc(t.category||"—")}</td><td><span class="pill p-${t.priority}">${t.priority}</span></td>
    <td><span class="pill st-${cls(t.status)}">${t.status}</span></td><td>${esc(t.assignee||"Unassigned")}</td>
    <td>${!isActive(t)?"—":isOverdue(t)?`<span class="overdue">Overdue</span>`:`in ${until(dueAt(t))}`}</td></tr>`).join("")}
  </tbody></table>`:`<div class="empty">No tickets match these filters</div>`}</div>`;
}

function vContacts(){
  const q=F.contacts.q.toLowerCase();
  const list=S.contacts.filter(c=>!q||[c.name,c.email,c.company,c.phone].join(" ").toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="head"><div><h1>Contacts</h1><div class="sub">Shared by Sales and IT Support</div></div><span class="spacer"></span>
    <input class="search" id="qc" placeholder="Search contacts…" value="${esc(F.contacts.q)}">
    <button class="btn primary" data-act="newContact">+ Contact</button></div>
  <div class="panel">${list.length?`<table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Deals</th><th>IT tickets</th></tr></thead><tbody>
  ${list.map(c=>`<tr class="click" data-open="contacts:${c.id}"><td><b style="font-weight:600">${esc(c.name)}</b><div class="hint">${esc(c.role||"")}</div></td><td>${esc(c.company||"—")}</td><td>${esc(c.email||"—")}</td><td>${esc(c.phone||"—")}</td>
    <td>${S.deals.filter(d=>d.contactId===c.id).length}</td><td>${S.tickets.filter(t=>t.contactId===c.id).length}</td></tr>`).join("")}
  </tbody></table>`:`<div class="empty">No contacts yet — add your first customer</div>`}</div>`;
}

/* ---------- bindings ---------- */
function bindView(){
  const m=$("#main");
  m.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>({newDeal:()=>formDeal(),newTicket:()=>formTicket(),newContact:()=>formContact()})[b.dataset.act]());
  m.querySelectorAll("[data-open]").forEach(r=>r.addEventListener("click",()=>{const[c,id]=r.dataset.open.split(":");openDrawer(c,id)}));
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.oninput=e.onchange=()=>{fn(e.value);render()}};
  on("qs",v=>F.sales.q=v);on("fo",v=>F.sales.owner=v);
  on("qt",v=>F.support.q=v);on("fs",v=>F.support.status=v);on("fp",v=>F.support.priority=v);on("fa",v=>F.support.assignee=v);
  on("qc",v=>F.contacts.q=v);
  // kanban drag & drop
  m.querySelectorAll(".card").forEach(c=>c.ondragstart=e=>{e.dataTransfer.setData("text/plain",c.dataset.id)});
  m.querySelectorAll(".col").forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add("over")};
    col.ondragleave=()=>col.classList.remove("over");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("over");const d=S.deals.find(x=>x.id===e.dataTransfer.getData("text/plain"));
      if(d&&d.stage!==col.dataset.stage)setDealStage(d,col.dataset.stage)};
  });
}
function setDealStage(d,stage){
  const r={...d,stage,updatedAt:Date.now(),notes:[...(d.notes||[]),{t:Date.now(),text:`Stage: ${d.stage} → ${stage}`,sys:true}]};
  if(!db){Object.assign(d,r)}save("deals",r);toast(`SAL-${d.num} moved to ${stage}`);
}

/* ---------- modal forms ---------- */
function modal(title,fields,rec,onSave){
  const md=$("#modal");
  const field=f=>{const v=rec[f.k]??f.def??"";
    if(f.type==="select")return `<select name="${f.k}">${f.opts.map(o=>Array.isArray(o)?o:[o,o]).map(([val,l])=>`<option value="${esc(val)}" ${String(val)===String(v)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
    if(f.type==="textarea")return `<textarea name="${f.k}">${esc(v)}</textarea>`;
    return `<input name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" ${f.req?"required":""} ${f.list?`list="${f.k}-l"`:""}>${f.list?`<datalist id="${f.k}-l">${f.list.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}`};
  const rows=[];for(let i=0;i<fields.length;i++){const f=fields[i];
    if(f.half&&fields[i+1]?.half){rows.push(`<div class="frow">${[f,fields[i+1]].map(x=>`<div class="f"><label>${x.label}</label>${field(x)}</div>`).join("")}</div>`);i++}
    else rows.push(`<div class="f"><label>${f.label}</label>${field(f)}${f.hint?`<div class="hint">${f.hint}</div>`:""}</div>`)}
  md.innerHTML=`<form><h2>${title}</h2>${rows.join("")}<div class="mfoot"><button type="button" class="btn" id="mcancel">Cancel</button><button class="btn primary">Save</button></div></form>`;
  md.classList.add("on");$("#mscrim").classList.add("on");
  md.querySelector("input,select,textarea")?.focus();
  md.querySelector("#mcancel").onclick=closeModal;
  md.querySelector("form").onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=typeof v==="string"?v.trim():v);onSave(o);closeModal()};
}
function closeModal(){$("#modal").classList.remove("on");$("#mscrim").classList.remove("on")}
$("#mscrim").onclick=closeModal;

const contactOpts=()=>[["","— No contact —"],...[...S.contacts].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>[c.id,c.name+(c.company?" · "+c.company:"")])];
const NEWC="__new";

function resolveContact(o){ // allow creating contact inline
  if(o.contactId===NEWC&&o.newContact){const c={id:uid("c"),name:o.newContact,createdAt:Date.now()};save("contacts",c);o.contactId=c.id}
  else if(o.contactId===NEWC)o.contactId="";
  delete o.newContact;return o;
}

function formDeal(d){
  const isNew=!d;d=d||{stage:"New lead"};
  modal(isNew?"New sales ticket":"Edit SAL-"+d.num,[
    {k:"title",label:"Deal / opportunity",req:true},
    {k:"contactId",label:"Contact",type:"select",opts:[...contactOpts(),[NEWC,"+ New contact…"]],half:true},
    {k:"newContact",label:"New contact name (if adding)",half:true},
    {k:"value",label:"Value (£)",type:"number",half:true},{k:"stage",label:"Stage",type:"select",opts:STAGES,half:true},
    {k:"owner",label:"Owner",half:true,list:[...new Set(S.deals.map(x=>x.owner).filter(Boolean))]},{k:"closeDate",label:"Expected close",type:"date",half:true},
    {k:"source",label:"Lead source",type:"select",opts:["",...SOURCES]},
    {k:"description",label:"Details",type:"textarea"}
  ],d,o=>{
    o=resolveContact(o);o.value=Number(o.value)||0;
    const r={...d,...o,updatedAt:Date.now()};
    if(isNew){r.id=uid("d");r.num=nextNum(S.deals,1001);r.createdAt=Date.now();r.notes=[{t:Date.now(),text:"Sales ticket created",sys:true}]}
    else if(d.stage!==o.stage)r.notes=[...(d.notes||[]),{t:Date.now(),text:`Stage: ${d.stage} → ${o.stage}`,sys:true}];
    save("deals",r);toast(isNew?`SAL-${r.num} created`:"Saved");
  });
}
function formTicket(t){
  const isNew=!t;t=t||{status:"Open",priority:"Normal"};
  modal(isNew?"New IT support ticket":"Edit IT-"+t.num,[
    {k:"subject",label:"Subject",req:true},
    {k:"contactId",label:"Requester",type:"select",opts:[...contactOpts(),[NEWC,"+ New contact…"]],half:true},
    {k:"newContact",label:"New requester name (if adding)",half:true},
    {k:"category",label:"Category",type:"select",opts:CATEGORIES,half:true},{k:"priority",label:"Priority",type:"select",opts:PRIORITY,half:true},
    {k:"status",label:"Status",type:"select",opts:T_STATUS,half:true},{k:"assignee",label:"Assignee",half:true,list:[...new Set(S.tickets.map(x=>x.assignee).filter(Boolean))]},
    {k:"description",label:"Description of the problem",type:"textarea"}
  ],t,o=>{
    o=resolveContact(o);
    const r={...t,...o,updatedAt:Date.now()};
    if(isNew){r.id=uid("t");r.num=nextNum(S.tickets,1001);r.createdAt=Date.now();r.notes=[{t:Date.now(),text:"Ticket opened",sys:true}]}
    else if(t.status!==o.status)r.notes=[...(t.notes||[]),{t:Date.now(),text:`Status: ${t.status} → ${o.status}`,sys:true}];
    if(!isActive(r)&&!r.resolvedAt)r.resolvedAt=Date.now(); if(isActive(r))r.resolvedAt=null;
    save("tickets",r);toast(isNew?`IT-${r.num} created`:"Saved");
  });
}
function formContact(c){
  const isNew=!c;c=c||{};
  modal(isNew?"New contact":"Edit contact",[
    {k:"name",label:"Full name",req:true},
    {k:"company",label:"Company",half:true,list:[...new Set(S.contacts.map(x=>x.company).filter(Boolean))]},{k:"role",label:"Job title",half:true},
    {k:"email",label:"Email",type:"email",half:true},{k:"phone",label:"Phone",half:true},
    {k:"notesText",label:"Notes",type:"textarea"}
  ],c,o=>{const r={...c,...o};if(isNew){r.id=uid("c");r.createdAt=Date.now()}save("contacts",r);toast("Contact saved")});
}

/* ---------- drawer ---------- */
function openDrawer(coll,id){openRec={coll,id};refreshDrawer();$("#drawer").classList.add("on");$("#dscrim").classList.add("on")}
function closeDrawer(){openRec=null;$("#drawer").classList.remove("on");$("#dscrim").classList.remove("on")}
$("#dscrim").onclick=closeDrawer;
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").classList.contains("on"))closeModal();else closeDrawer()}});

function refreshDrawer(){
  if(!openRec)return;const{coll,id}=openRec;const r=S[coll].find(x=>x.id===id);const dr=$("#drawer");
  if(!r){closeDrawer();return}
  const draft=dr.querySelector("#nt")?.value||"";
  const notesBlock=(notes)=>`<div class="notes"><h4>Activity</h4>${[...(notes||[])].reverse().map(n=>`<div class="note"><div class="w">${new Date(n.t).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}</div><div style="${n.sys?"color:var(--muted)":""}">${esc(n.text)}</div></div>`).join("")||`<div class="hint">No activity yet</div>`}
    <div class="addnote"><textarea id="nt" placeholder="Add a note or update…">${esc(draft)}</textarea><button class="btn primary" id="addn">Add</button></div></div>`;
  const sel=(id,cur,opts)=>`<select id="${id}">${opts.map(o=>`<option ${o===cur?"selected":""}>${o}</option>`).join("")}</select>`;
  let h="";
  if(coll==="deals"){
    h=`<header><span class="tag s">Sales · SAL-${r.num}</span><h2>${esc(r.title)}</h2></header><div class="body">
      <div class="kv"><span class="k">Stage</span>${sel("dstage",r.stage,STAGES)}
      <span class="k">Value</span><b>${money(r.value)}</b>
      <span class="k">Contact</span><span>${contact(r.contactId)?`<a href="#" id="goc">${esc(cname(r.contactId))}</a>`:"—"}</span>
      <span class="k">Owner</span><span>${esc(r.owner||"—")}</span>
      <span class="k">Expected close</span><span>${fmtDate(r.closeDate)}</span>
      <span class="k">Source</span><span>${esc(r.source||"—")}</span>
      <span class="k">Created</span><span>${fmtDate(r.createdAt)}</span></div>
      ${r.description?`<div class="desc">${esc(r.description)}</div>`:""}${notesBlock(r.notes)}</div>`;
  }else if(coll==="tickets"){
    h=`<header><span class="tag i">IT Support · IT-${r.num}</span><h2>${esc(r.subject)}</h2></header><div class="body">
      <div class="kv"><span class="k">Status</span>${sel("tstatus",r.status,T_STATUS)}
      <span class="k">Priority</span>${sel("tprio",r.priority,PRIORITY)}
      <span class="k">Requester</span><span>${contact(r.contactId)?`<a href="#" id="goc">${esc(cname(r.contactId))}</a>`:"—"}</span>
      <span class="k">Category</span><span>${esc(r.category||"—")}</span>
      <span class="k">Assignee</span><span>${esc(r.assignee||"Unassigned")}</span>
      <span class="k">Opened</span><span>${new Date(r.createdAt).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}</span>
      <span class="k">SLA due</span><span class="${isOverdue(r)?"overdue":""}">${new Date(dueAt(r)).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}${isOverdue(r)?" · overdue":""}</span>
      ${r.resolvedAt?`<span class="k">Resolved</span><span>${fmtDate(r.resolvedAt)}</span>`:""}</div>
      ${r.description?`<div class="desc">${esc(r.description)}</div>`:""}${notesBlock(r.notes)}</div>`;
  }else{
    const ds=S.deals.filter(d=>d.contactId===r.id),ts=S.tickets.filter(t=>t.contactId===r.id);
    h=`<header><span class="tag">Contact</span><h2>${esc(r.name)}</h2><div class="hint">${esc([r.role,r.company].filter(Boolean).join(" · "))}</div></header><div class="body">
      <div class="kv"><span class="k">Email</span><span>${esc(r.email||"—")}</span><span class="k">Phone</span><span>${esc(r.phone||"—")}</span><span class="k">Added</span><span>${fmtDate(r.createdAt)}</span></div>
      ${r.notesText?`<div class="desc">${esc(r.notesText)}</div>`:""}
      <div class="notes"><h4><span class="tag s">Sales tickets</span> (${ds.length})</h4>${ds.map(d=>`<div class="note" style="cursor:pointer" data-jump="deals:${d.id}"><span class="id">SAL-${d.num}</span> ${esc(d.title)} · <span class="pill">${d.stage}</span> ${money(d.value)}</div>`).join("")||`<div class="hint">None</div>`}
      <h4 style="margin-top:16px"><span class="tag i">IT tickets</span> (${ts.length})</h4>${ts.map(t=>`<div class="note" style="cursor:pointer" data-jump="tickets:${t.id}"><span class="id">IT-${t.num}</span> ${esc(t.subject)} · <span class="pill st-${cls(t.status)}">${t.status}</span></div>`).join("")||`<div class="hint">None</div>`}</div></div>`;
  }
  h+=`<div class="foot"><button class="btn" id="dedit">Edit</button><button class="btn danger" id="ddel">Delete</button><span class="spacer"></span><button class="btn" id="dclose">Close</button></div>`;
  dr.innerHTML=h;
  dr.querySelector("#dclose").onclick=closeDrawer;
  dr.querySelector("#dedit").onclick=()=>({deals:formDeal,tickets:formTicket,contacts:formContact})[coll](r);
  const delb=dr.querySelector("#ddel");delb.onclick=()=>{if(!delb.classList.contains("armed")){delb.classList.add("armed");delb.textContent="Click again to delete";setTimeout(()=>{delb.classList.remove("armed");delb.textContent="Delete"},3000);return}
    del(coll,r.id);closeDrawer();toast("Deleted")};
  dr.querySelector("#goc")?.addEventListener("click",e=>{e.preventDefault();openDrawer("contacts",r.contactId)});
  dr.querySelectorAll("[data-jump]").forEach(x=>x.onclick=()=>{const[c,i]=x.dataset.jump.split(":");openDrawer(c,i)});
  dr.querySelector("#dstage")?.addEventListener("change",e=>setDealStage(r,e.target.value));
  const tchange=(field,val)=>{const r2={...r,[field]:val,updatedAt:Date.now(),notes:[...(r.notes||[]),{t:Date.now(),text:`${field==="status"?"Status":"Priority"}: ${r[field]} → ${val}`,sys:true}]};
    if(field==="status"){r2.resolvedAt=isActive(r2)?null:(r.resolvedAt||Date.now())}save("tickets",r2)};
  dr.querySelector("#tstatus")?.addEventListener("change",e=>tchange("status",e.target.value));
  dr.querySelector("#tprio")?.addEventListener("change",e=>tchange("priority",e.target.value));
  const addn=dr.querySelector("#addn");
  if(addn)addn.onclick=()=>{const tx=dr.querySelector("#nt").value.trim();if(!tx)return;dr.querySelector("#nt").value="";
    save(coll,{...r,updatedAt:Date.now(),notes:[...(r.notes||[]),{t:Date.now(),text:tx}]})};
}

route();init();
setInterval(()=>{if(view!=="contacts"&&!$("#modal").classList.contains("on"))render()},60000); // refresh SLA timers
</script>
</body>
</html>
