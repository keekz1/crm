# AWS Amplify Hosting build settings.
# Set these in Amplify → your app → Hosting → Environment variables:
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the "anon public" key (never the service_role key)
#   COMPANY_NAME       optional, shown on the login screen
# If they're not set, the js/config.js committed in the repo is used as-is.
version: 1
frontend:
  phases:
    build:
      commands:
        - rm -rf dist && mkdir -p dist
        - cp -r index.html css js dist/
        - |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'window.CRM_CONFIG = {\n  SUPABASE_URL: "%s",\n  SUPABASE_ANON_KEY: "%s",\n  COMPANY_NAME: "%s"\n};\n' \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "${COMPANY_NAME:-CoreCRM}" > dist/js/config.js
            echo "Wrote dist/js/config.js from environment variables"
          else
            echo "SUPABASE_URL / SUPABASE_ANON_KEY not set: using js/config.js from the repo"
          fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
